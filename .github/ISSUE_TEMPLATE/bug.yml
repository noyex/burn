name: Bug report
description: Something in Burn doesn't work or shows wrong numbers
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Burn version
      description: The release you installed, e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: checkboxes
    id: providers
    attributes:
      label: Providers involved
      options:
        - label: Claude Code
        - label: Codex
        - label: Cursor
