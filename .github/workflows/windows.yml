name: Windows

on:
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/ui/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      - name: Panel UI
        working-directory: windows/ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Theme literals
        shell: bash
        run: bash scripts/check-theme-literals.sh
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        # custom-protocol: the app serves the built UI instead of the dev server (what `tauri build` adds).
        run: |
          cargo build --release --locked -p burn-app --features tauri/custom-protocol
          cargo build --release --locked -p burn-core --bin burn-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burn-windows
          path: |
            windows/target/release/burn.exe
            windows/target/release/burn-cli.exe
          if-no-files-found: error
