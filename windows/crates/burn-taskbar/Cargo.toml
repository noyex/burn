[package]
name = "burn-taskbar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Burn's Windows taskbar widget (milestone 1 spike, demo data)"

[[bin]]
name = "burn-spike"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
resvg = { version = "0.50", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5"
